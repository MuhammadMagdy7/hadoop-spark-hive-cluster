# ─────────────────────────────────────────────────────────────────────────────
#  Big Data Stack: HDFS + YARN + Hive 4 + Spark
#
#  SETUP (run once before docker compose up):
#    mkdir lib
#    Invoke-WebRequest -Uri "https://jdbc.postgresql.org/download/postgresql-42.7.3.jar" -OutFile "lib\postgresql-42.7.3.jar"
#
#  Your folder structure should look like:
#    chapter2_hcip/
#    ├── docker-compose.yml
#    ├── conf/
#    │   └── hive-site.xml        ← download from outputs
#    └── lib/
#        └── postgresql-42.7.3.jar
# ─────────────────────────────────────────────────────────────────────────────

networks:
  hadoop-net:
    driver: bridge

volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  hive-metastore-db-data:
  hive-warehouse:

services:

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    environment:
      CLUSTER_NAME: "dev-cluster"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode-data:/hadoop/dfs/name
    networks:
      - hadoop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    hostname: datanode1
    restart: unless-stopped
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_permissions_enabled: "false"
    volumes:
      - datanode1-data:/hadoop/dfs/data
    networks:
      - hadoop-net
    depends_on:
      namenode:
        condition: service_healthy

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    hostname: datanode2
    restart: unless-stopped
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_permissions_enabled: "false"
    volumes:
      - datanode2-data:/hadoop/dfs/data
    networks:
      - hadoop-net
    depends_on:
      namenode:
        condition: service_healthy

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    hostname: resourcemanager
    restart: unless-stopped
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
      YARN_CONF_yarn_resourcemanager_address: resourcemanager:8032
      YARN_CONF_yarn_resourcemanager_scheduler_address: resourcemanager:8030
      YARN_CONF_yarn_resourcemanager_resource__tracker_address: resourcemanager:8031
    ports:
      - "8088:8088"
    networks:
      - hadoop-net
    depends_on:
      namenode:
        condition: service_healthy

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    hostname: nodemanager
    restart: unless-stopped
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
    networks:
      - hadoop-net
    depends_on:
      - resourcemanager

  hive-metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    hostname: hive-metastore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive-metastore-db-data:/var/lib/postgresql/data
    networks:
      - hadoop-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────
  #  Hive Metastore
  #
  #  KEY FIXES:
  #  1. DB_DRIVER=postgres  tells entrypoint to use postgres for schematool
  #  2. IS_RESUME=false     runs schematool -initOrUpgradeSchema on boot
  #  3. hive-site.xml       provides JDBC connection details reliably
  #  4. postgresql jar      mounted into /opt/hive/lib/
  #  5. HIVE_CONF_DIR       pointed at our custom conf with hive-site.xml
  # ───────────────────────────────────────────
  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    hostname: hive-metastore
    restart: unless-stopped
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "false"
      HIVE_CONF_DIR: /opt/hive/conf
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
      - ./lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
      - ./conf/hive-site.xml:/opt/hive/conf/hive-site.xml
    ports:
      - "9083:9083"
    networks:
      - hadoop-net
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083' 2>/dev/null && exit 0 || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 120s

  hiveserver2:
    image: apache/hive:4.0.0
    container_name: hiveserver2
    hostname: hiveserver2
    restart: unless-stopped
    environment:
      SERVICE_NAME: hiveserver2
      DB_DRIVER: postgres
      IS_RESUME: "false"
      HIVE_CONF_DIR: /opt/hive/conf
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
      - ./lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
      - ./conf/hive-site.xml:/opt/hive/conf/hive-site.xml
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - hadoop-net
    depends_on:
      hive-metastore:
        condition: service_healthy

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    environment:
      INIT_DAEMON_STEP: setup_spark
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - hadoop-net
    depends_on:
      namenode:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    restart: unless-stopped
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    ports:
      - "8081:8081"
    networks:
      - hadoop-net
    depends_on:
      - spark-master

  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-2
    hostname: spark-worker-2
    restart: unless-stopped
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    ports:
      - "8082:8082"
    networks:
      - hadoop-net
    depends_on:
      - spark-master

  spark-history-server:
      image: bde2020/spark-history-server:3.3.0-hadoop3.3
      container_name: spark-history-server
      hostname: spark-history-server
      restart: unless-stopped
      environment:
        # SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=hdfs://namenode:9000/spark-logs"
        # SPARK_HISTORY_FS_LOGDIRECTORY: "hdfs://namenode:9000/spark-logs"
        # SPARK_EVENTLOG_DIR: "hdfs://namenode:9000/spark-logs"
        # CORE_CONF_fs_defaultFS: hdfs://namenode:9000
        SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=hdfs://namenode:9000/spark-logs -Dspark.history.ui.port=18080"
        SPARK_HISTORY_FS_LOGDIRECTORY: "hdfs://namenode:9000/spark-logs"
        SPARK_EVENTLOG_DIR: "hdfs://namenode:9000/spark-logs"
        CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      ports:
        - "18080:18081"
      volumes:
        - /tmp/spark-events
      networks:
        - hadoop-net
      depends_on:
        namenode:
          condition: service_healthy

  # spark-history-server:
  #   image: bde2020/spark-history-server:3.3.0-hadoop3.3
  #   container_name: spark-history-server
  #   hostname: spark-history-server
  #   restart: unless-stopped
  #   environment:
  #     SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=hdfs://namenode:9000/spark-logs"
